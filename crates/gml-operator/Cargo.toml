[package]
name = "gml-operator"
version = "0.2.0"
edition = "2024"
repository = "https://github.com/Salazar-99/gml"
homepage = "https://salazar-99.github.io/gml/"
description = "Kubernetes operator for the gml GPU machine management CLI"

[dependencies]
kube = { version = "3.0.1", features = ["runtime", "derive"] }
k8s-openapi = { version = "0.27.0", features = ["latest", "schemars"] }
schemars = { version = "1" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
futures = "0.3"
tokio = { version = "1", features = ["full"] }
thiserror = "1"

[package.metadata.dist]
dist = false

[[bin]]
name = "crdgen"
path = "src/crdgen.rs"