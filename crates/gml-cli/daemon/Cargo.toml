[package]
name = "gml-daemon"
version = "0.2.0"
edition = "2024"
repository = "https://github.com/Salazar-99/gml"
homepage = "https://salazar-99.github.io/gml/"
description = "Background daemon for the gml GPU machine management CLI"

[[bin]]
name = "gmld"
path = "src/main.rs"

[dependencies]
gml-core = { path = "../core" }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"

